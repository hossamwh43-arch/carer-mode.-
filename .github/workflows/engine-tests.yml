name: engine-tests
# اختبارات المحرك بلا متصفح (Node فقط): تعمل على كل push لفروع التطوير وعلى طلبات الدمج إلى الرئيسي،
# فلا يُدمج تغيير يعيد تضخّم التقييمات أو هيمنة نادٍ واحد أو يكسر ثوابت العالم.
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: اختبار انحدار العالم الحي (16 موسمًا × بذرتين)
        run: node tests/engine/world_stationary.js 16 3,4
      - name: نواة الملعب المرئي (حتمية، عزل عن عشوائية اللعبة، أطقم، تخطيط هجمات)
        run: node tests/engine/stadium_core.js
      - name: نهاية المسيرة وغرفة الملابس (اعتزال إجباري، تراجع عمري، الإرث، علاقة الزملاء)
        run: node tests/engine/career_end.js
      - name: اللياقة بثلاث طبقات وتبديلات المدرب (Build 24)
        run: node tests/engine/stamina.js 5,9
      - name: القدم الأضعف في اللحظات التفاعلية (Build 24)
        run: node tests/engine/moments_foot.js 5,9
      - name: معايرة الدوريات مقابل أرقام حقيقية (Build 25)
        run: node tests/engine/calib_real.js 6 3
      - name: تصنيفات العالم — أرشفة ومحرك (Build 26)
        run: node tests/engine/world_rank.js 5 3
      - name: الكرة الذهبية الشهرية وترحيل الحفظ القديم (Build 28)
        run: node tests/engine/bd_months.js
      - name: نوافذ تصنيف الأندية 1 و5 و10 و50 و100 سنة (Build 28)
        run: node tests/engine/crk_windows.js
      - name: قدرات النجوم المميزة (Build 28)
        run: node tests/engine/traits.js
      - name: المدير الفني لكل نادٍ ومقارنته بالمنطق القديم (Build 28)
        run: node tests/engine/director.js 3
