<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#060a15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مسيرة لاعب — Player Career</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot" class="boot"><div class="boot-ball">⚽</div><div>جارٍ تحميل اللعبة…</div></div>
<header id="topbar" class="topbar hidden">
  <div class="tb-side"><span id="tbCrest" class="tb-crest" aria-hidden="true"></span><button id="backBtn" class="icon-btn hidden" data-a="goBack" aria-label="رجوع"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-arrowr"/></svg></button></div>
  <div id="topTitle" class="top-title"></div>
  <div class="tb-side tb-end"><button class="icon-btn" data-a="go" data-v="inbox" aria-label="الرسائل"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mail"/></svg><span id="inboxBadge" class="badge hidden">0</span></button></div>
</header>
<main id="app" class="app"></main>
<nav id="bottomnav" class="bottomnav hidden" aria-label="التنقل الرئيسي">
  <button data-a="goGroup" data-v="home" data-g="home"><span class="bn-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg></span><small>الرئيسية</small></button>
  <button data-a="goGroup" data-v="me" data-g="me"><span class="bn-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg></span><small>مسيرتي</small></button>
  <button data-a="goGroup" data-v="matches" data-g="matches" class="bn-mid"><span class="bn-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-pitch"/></svg><i id="matchDot" class="bn-dot hidden"></i></span><small>المباريات</small></button>
  <button data-a="goGroup" data-v="club" data-g="club"><span class="bn-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-club"/></svg></span><small>النادي</small></button>
  <button data-a="goGroup" data-v="more" data-g="more"><span class="bn-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-grid"/></svg><i id="moreDot" class="bn-dot hidden"></i></span><small>المزيد</small></button>
</nav>
<div id="sheetWrap" class="sheet-wrap hidden"><div class="sheet-back" data-a="closeSheet"></div><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
